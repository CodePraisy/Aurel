name: Build release downloads
# Publishes Aurel <version from package.json> with Windows and Mac downloads.
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.2.0.
# Installed copies of Aurel find the new release and offer to update.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Create the release if it does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Aurel ${TAG#v}" --generate-notes --target "$GITHUB_SHA"

  packages:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck && npm test
      - name: Build and scan the Windows VST3 helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./native/vst-host/build.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $helper = (Resolve-Path 'build/vst-host/aurel-vst-host.exe').Path
          $started = Get-Date
          Start-MpScan -ScanType CustomScan -ScanPath $helper -ErrorAction Stop
          $detections = Get-MpThreatDetection -ErrorAction Stop | Where-Object {
            $_.InitialDetectionTime -ge $started.AddMinutes(-1) -and ($_.Resources -join ' ').Contains($helper)
          }
          if ($detections -or !(Test-Path -LiteralPath $helper)) { throw 'Defender flagged the rebuilt VST3 helper. Windows publishing stopped.' }
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node node_modules/electron-vite/bin/electron-vite.js build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node node_modules/electron-builder/cli.js --win nsis portable --x64 --publish never
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - if: runner.os == 'macOS'
        run: npm run dist:mac -- --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Attach downloads to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          shopt -s nullglob
          files=(release/Aurel-*-Windows-x64*.exe release/Aurel-*-macOS-*.zip)
          test "${#files[@]}" -gt 0
          gh release upload "$TAG" "${files[@]}" --clobber -R "$GITHUB_REPOSITORY"
